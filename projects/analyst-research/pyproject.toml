[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "analyst-team"
version = "0.1.0"
description = "Turn evidence-backed public research archives into callable analysts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
  "lightrag-hku>=1.4,<2",
  "openai-agents>=0.8,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "qrcode[pil]>=8,<9",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
analyst-team = "analyst_team.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
".agents/skills/*/scripts/*.py" = ["BLE001", "DTZ007", "DTZ011"]
"data/analysts/*/scripts/*.py" = ["BLE001", "DTZ011", "S110"]
"staging/*/scripts/*.py" = ["BLE001", "DTZ007", "DTZ011"]
"tools/verify_kevin_public_urls.py" = ["BLE001", "DTZ007"]
