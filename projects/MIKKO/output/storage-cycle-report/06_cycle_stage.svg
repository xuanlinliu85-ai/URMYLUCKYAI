<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1060" viewBox="0 0 1900 1060"><rect x="0" y="0" width="1900" height="1060" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/><text x="80" y="82" font-size="42" fill="#16202A" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">这一轮存储周期走到哪里？</text><text x="80" y="128" font-size="20" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">当前位于盈利兑现后段，并开始交易涨价二阶导与长期利润中枢</text><rect x="80" y="155" width="1740" height="6" rx="0" fill="#D99A2B" stroke="none" stroke-width="0"/><rect x="80" y="330" width="375" height="330" rx="20" fill="#FFFFFF" stroke="#2E6F95" stroke-width="4"/><text x="106" y="385" font-size="20" fill="#2E6F95" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">阶段1</text><text x="267.5" y="485" font-size="31" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">供给紧张</text><text x="267.5" y="555" font-size="21" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="267.5" dy="0">库存下降</tspan><tspan x="267.5" dy="31.5">现货先涨</tspan></text><line x1="475" y1="495" x2="520" y2="495" stroke="#16202A" stroke-width="3" /><rect x="535" y="330" width="375" height="330" rx="20" fill="#FFFFFF" stroke="#D99A2B" stroke-width="4"/><text x="561" y="385" font-size="20" fill="#D99A2B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">阶段2</text><text x="722.5" y="485" font-size="31" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">盈利上修</text><text x="722.5" y="555" font-size="21" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="722.5" dy="0">ASP上涨</tspan><tspan x="722.5" dy="31.5">分析师上调EPS</tspan></text><line x1="930" y1="495" x2="975" y2="495" stroke="#16202A" stroke-width="3" /><rect x="990" y="330" width="375" height="330" rx="20" fill="#FFFFFF" stroke="#7A8B52" stroke-width="4"/><text x="1016" y="385" font-size="20" fill="#7A8B52" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">阶段3</text><text x="1177.5" y="485" font-size="31" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">现金流爆发</text><text x="1177.5" y="555" font-size="21" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1177.5" dy="0">毛利率创纪录</tspan><tspan x="1177.5" dy="31.5">长协集中签订</tspan></text><line x1="1385" y1="495" x2="1430" y2="495" stroke="#16202A" stroke-width="3" /><rect x="1445" y="330" width="375" height="330" rx="20" fill="#FFFFFF" stroke="#C86B35" stroke-width="4"/><text x="1471" y="385" font-size="20" fill="#C86B35" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">阶段4</text><text x="1632.5" y="485" font-size="31" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">持续性定价</text><text x="1632.5" y="555" font-size="21" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1632.5" dy="0">涨价斜率放缓</tspan><tspan x="1632.5" dy="31.5">估值看正常化利润</tspan></text><text x="1480" y="270" font-size="28" fill="#C86B35" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">当前</text><line x1="1480" y1="285" x2="1480" y2="325" stroke="#C86B35" stroke-width="5" /><text x="950" y="800" font-size="24" fill="#153B5B" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">尚未确认下行：需要看到位元出货走弱、渠道库存上升、长协条款恶化和盈利预测连续下修。</text><text x="80" y="1028" font-size="15" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">来源：MIKKO Research框架。阶段划分为分析性判断，不代表精确择时信号。</text></svg>