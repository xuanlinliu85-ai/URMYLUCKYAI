<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080"><rect x="0" y="0" width="1900" height="1080" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/><text x="80" y="82" font-size="42" fill="#16202A" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">为什么939亿美元不能直接推出“地板价是现价一半”</text><text x="80" y="128" font-size="20" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">金额比较缺少承诺位元数量、年度分布和产品组合三个关键分母</text><rect x="80" y="155" width="1740" height="6" rx="0" fill="#D99A2B" stroke="none" stroke-width="0"/><rect x="90" y="280" width="420" height="245" rx="20" fill="#153B5B" stroke="none" stroke-width="0"/><text x="300" y="390" font-size="40" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">$93.9B</text><text x="300" y="458" font-size="19" fill="#E8EEF1" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">合约期最低可执行总金额</text><rect x="740" y="280" width="420" height="245" rx="20" fill="#D99A2B" stroke="none" stroke-width="0"/><text x="950" y="390" font-size="40" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">约$21–22B/年</text><text x="950" y="458" font-size="19" fill="#E8EEF1" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">按4年多机械摊分</text><rect x="1390" y="280" width="420" height="245" rx="20" fill="#153B5B" stroke="none" stroke-width="0"/><text x="1600" y="390" font-size="40" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">约$42.2B/年</text><text x="1600" y="458" font-size="19" fill="#E8EEF1" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">FQ1 FY27指引中值年化</text><line x1="535" y1="402" x2="705" y2="402" stroke="#16202A" stroke-width="3" /><text x="620" y="380" font-size="19" fill="#16202A" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">÷ 加权期限</text><line x1="1185" y1="402" x2="1355" y2="402" stroke="#C86B35" stroke-width="4" /><text x="1270" y="380" font-size="20" fill="#C86B35" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">错误比较</text><rect x="180" y="635" width="1540" height="205" rx="22" fill="#FFFFFF" stroke="#D3CEC4" stroke-width="2"/><text x="950" y="700" font-size="28" fill="#153B5B" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">正确的单位价格推导</text><text x="950" y="770" font-size="25" fill="#16202A" font-weight="500" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">地板价 / bit ＝ 93.9B ÷ 合约期承诺总位元（还需按年份、产品和制程调整）</text><text x="950" y="910" font-size="27" fill="#C86B35" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">结论：939亿美元能证明订单约束力，不能单独证明闪迪按半价锁死四年。</text><text x="80" y="1048" font-size="15" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">来源：Sandisk FY2026 Q4电话会/文章口径及公司收入指引；计算为口径辨析，不是公司盈利预测。</text></svg>