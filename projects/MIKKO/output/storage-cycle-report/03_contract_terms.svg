<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1320" viewBox="0 0 2100 1320"><rect x="0" y="0" width="2100" height="1320" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/><text x="80" y="82" font-size="42" fill="#16202A" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">长期协议：行业从现货交易走向“容量预约 + 价格区间”</text><text x="80" y="128" font-size="20" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">条款总体向供应商倾斜，但覆盖率、定价机制与可执行金额仍不可混为一谈</text><rect x="80" y="155" width="1940" height="6" rx="0" fill="#D99A2B" stroke="none" stroke-width="0"/><rect x="80" y="220" width="210" height="75" rx="0" fill="#153B5B" stroke="none" stroke-width="0"/><rect x="290" y="220" width="445" height="75" rx="0" fill="#153B5B" stroke="#F7F5EF" stroke-width="2"/><text x="512.5" y="268" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">三星</text><rect x="735" y="220" width="445" height="75" rx="0" fill="#153B5B" stroke="#F7F5EF" stroke-width="2"/><text x="957.5" y="268" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">SK海力士</text><rect x="1180" y="220" width="445" height="75" rx="0" fill="#153B5B" stroke="#F7F5EF" stroke-width="2"/><text x="1402.5" y="268" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">美光</text><rect x="1625" y="220" width="445" height="75" rx="0" fill="#153B5B" stroke="#F7F5EF" stroke-width="2"/><text x="1847.5" y="268" font-size="25" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">闪迪</text><rect x="80" y="295" width="210" height="175" rx="0" fill="#DCE4E8" stroke="#FFFFFF" stroke-width="2"/><text x="102" y="393" font-size="23" fill="#153B5B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">期限</text><rect x="290" y="295" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="512.5" y="363" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="512.5" dy="0">5年 + 滚动延期</tspan></text><rect x="735" y="295" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="957.5" y="363" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="957.5" dy="0">多数约5年</tspan></text><rect x="1180" y="295" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="1402.5" y="363" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1402.5" dy="0">多数5年</tspan></text><rect x="1625" y="295" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="1847.5" y="363" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1847.5" dy="0">加权平均4年多</tspan><tspan x="1847.5" dy="31">最长5年</tspan></text><rect x="80" y="470" width="210" height="175" rx="0" fill="#DCE4E8" stroke="#FFFFFF" stroke-width="2"/><text x="102" y="568" font-size="23" fill="#153B5B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">覆盖</text><rect x="290" y="470" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="512.5" y="538" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="512.5" dy="0">目标60–70%规划产能</tspan></text><rect x="735" y="470" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="957.5" y="538" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="957.5" dy="0">10+份LTA</tspan></text><rect x="1180" y="470" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="1402.5" y="538" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1402.5" dy="0">20% DRAM、1/3 NAND</tspan><tspan x="1402.5" dy="31">目标≥50%收入</tspan></text><rect x="1625" y="470" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="1847.5" y="538" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1847.5" dy="0">FY27&gt;50%</tspan><tspan x="1847.5" dy="31">FY28约2/3位元</tspan></text><rect x="80" y="645" width="210" height="175" rx="0" fill="#DCE4E8" stroke="#FFFFFF" stroke-width="2"/><text x="102" y="743" font-size="23" fill="#153B5B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">定价</text><rect x="290" y="645" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="512.5" y="713" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="512.5" dy="0">客户化地板价</tspan></text><rect x="735" y="645" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="957.5" y="713" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="957.5" dy="0">未充分披露</tspan></text><rect x="1180" y="645" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="1402.5" y="713" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1402.5" dy="0">地板—天花板区间</tspan></text><rect x="1625" y="645" width="445" height="175" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="1847.5" y="713" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1847.5" dy="0">长期合约更偏可变价</tspan></text><rect x="80" y="820" width="210" height="175" rx="0" fill="#DCE4E8" stroke="#FFFFFF" stroke-width="2"/><text x="102" y="918" font-size="23" fill="#153B5B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">约束力</text><rect x="290" y="820" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="512.5" y="888" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="512.5" dy="0">多年保证金</tspan></text><rect x="735" y="820" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="957.5" y="888" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="957.5" dy="0">未充分披露</tspan></text><rect x="1180" y="820" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="1402.5" y="888" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1402.5" dy="0">Take-or-pay</tspan><tspan x="1402.5" dy="31">$22B保证金/承诺</tspan></text><rect x="1625" y="820" width="445" height="175" rx="0" fill="#EEEAE1" stroke="#FFFFFF" stroke-width="2"/><text x="1847.5" y="888" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1847.5" dy="0">$93.9B最低可执行额*</tspan></text><rect x="80" y="995" width="210" height="175" rx="0" fill="#DCE4E8" stroke="#FFFFFF" stroke-width="2"/><text x="102" y="1093" font-size="23" fill="#153B5B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">主要风险</text><rect x="290" y="995" width="445" height="175" rx="0" fill="#F6E7DC" stroke="#FFFFFF" stroke-width="2"/><text x="512.5" y="1063" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="512.5" dy="0">扩产后供给释放</tspan></text><rect x="735" y="995" width="445" height="175" rx="0" fill="#F6E7DC" stroke="#FFFFFF" stroke-width="2"/><text x="957.5" y="1063" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="957.5" dy="0">HBM/通用DRAM错配</tspan></text><rect x="1180" y="995" width="445" height="175" rx="0" fill="#F6E7DC" stroke="#FFFFFF" stroke-width="2"/><text x="1402.5" y="1063" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1402.5" dy="0">天花板限制涨价弹性</tspan></text><rect x="1625" y="995" width="445" height="175" rx="0" fill="#F6E7DC" stroke="#FFFFFF" stroke-width="2"/><text x="1847.5" y="1063" font-size="20" fill="#16202A" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1847.5" dy="0">不能由金额倒推单位价格</tspan></text><text x="80" y="1215" font-size="24" fill="#153B5B" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">核心变化：量、价和资金承诺同时进入合同；这会压低盈利波动，但不会消灭需求与供给周期。</text><text x="80" y="1288" font-size="15" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">来源：公司材料、美光FQ3 FY2026演示稿、高盛全球投资研究（用户提供节选）。*闪迪$93.9B为电话会/文章口径。</text></svg>