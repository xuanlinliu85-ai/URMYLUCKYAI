<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120"><rect x="0" y="0" width="2000" height="1120" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/><text x="80" y="82" font-size="42" fill="#16202A" font-weight="700" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">宏观如何传导到存储利润？</text><text x="80" y="128" font-size="20" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">本轮需求核心来自现金流充足的CSP资本开支，但利率、能源与供给扩张决定估值和持续时间</text><rect x="80" y="155" width="1840" height="6" rx="0" fill="#D99A2B" stroke="none" stroke-width="0"/><rect x="90" y="345" width="320" height="260" rx="18" fill="#FFFFFF" stroke="#2E6F95" stroke-width="4"/><text x="250" y="433" font-size="27" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">宏观条件</text><text x="250" y="500" font-size="20" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="250" dy="0">实际利率 / 美元</tspan><tspan x="250" dy="31">金融条件</tspan></text><line x1="430" y1="475" x2="465" y2="475" stroke="#16202A" stroke-width="4" /><rect x="485" y="345" width="320" height="260" rx="18" fill="#FFFFFF" stroke="#D99A2B" stroke-width="4"/><text x="645" y="433" font-size="27" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">CSP资本开支</text><text x="645" y="500" font-size="20" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="645" dy="0">订单与积压</tspan><tspan x="645" dy="31">数据中心建设</tspan></text><line x1="825" y1="475" x2="860" y2="475" stroke="#16202A" stroke-width="4" /><rect x="880" y="345" width="320" height="260" rx="18" fill="#FFFFFF" stroke="#7A8B52" stroke-width="4"/><text x="1040" y="433" font-size="27" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">AI存储需求</text><text x="1040" y="500" font-size="20" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1040" dy="0">HBM / DRAM</tspan><tspan x="1040" dy="31">企业级SSD / HDD</tspan></text><line x1="1220" y1="475" x2="1255" y2="475" stroke="#16202A" stroke-width="4" /><rect x="1275" y="345" width="320" height="260" rx="18" fill="#FFFFFF" stroke="#C86B35" stroke-width="4"/><text x="1435" y="433" font-size="27" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">供应与长协</text><text x="1435" y="500" font-size="20" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1435" dy="0">洁净室约束</tspan><tspan x="1435" dy="31">Take-or-pay</tspan></text><line x1="1615" y1="475" x2="1650" y2="475" stroke="#16202A" stroke-width="4" /><rect x="1670" y="345" width="240" height="260" rx="18" fill="#FFFFFF" stroke="#153B5B" stroke-width="4"/><text x="1790" y="433" font-size="27" fill="#16202A" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">资产定价</text><text x="1790" y="500" font-size="20" fill="#747B82" font-weight="400" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif"><tspan x="1790" dy="0">盈利持续性</tspan><tspan x="1790" dy="31">估值倍数</tspan></text><text x="255" y="720" font-size="20" fill="#2E6F95" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">利率上升先压估值，未必立刻取消已签订单</text><text x="870" y="775" font-size="20" fill="#D99A2B" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">现金流融资比杠杆融资更稳健</text><text x="1390" y="720" font-size="20" fill="#C86B35" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">长协把部分扩产风险从原厂转移给客户</text><rect x="300" y="855" width="1400" height="120" rx="16" fill="#EEEAE1" stroke="none" stroke-width="0"/><text x="1000" y="905" font-size="22" fill="#16202A" font-weight="600" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">关键非线性：若AI变现放缓 + 长端利率上行 + 2027–28供给释放同时发生，</text><text x="1000" y="947" font-size="24" fill="#C86B35" font-weight="700" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif">存储板块会从“二阶导放缓”转为“盈利预测下修”。</text><text x="80" y="1088" font-size="15" fill="#747B82" font-weight="400" text-anchor="start" font-family="Microsoft YaHei,Arial,sans-serif">来源：MIKKO Research宏观传导框架；公司资本开支、订单与供应信息来自企业披露。</text></svg>